name: Fetch & Deploy

# 每天两次抓取（北京 08:23 / 20:41，错峰分钟降低 GitHub cron 高峰延迟）；
# 早上那次可能赶不上当天早间发文，晚间那次兜底收录全天。
on:
  schedule:
    - cron: '23 0 * * *'
    - cron: '41 12 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发写 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # corepack 按 package.json 的 packageManager 字段装 pnpm，替代 pnpm/action-setup
      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # build 先于 test：布局/导航产物断言测试需要 dist 存在（本地跑 vitest 前也先 build）
      - name: Build site (pre-test)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Fetch news
        run: pnpm fetch-news

      - name: Fetch repo radar
        run: pnpm fetch-repos

      # arena.ai 有 Cloudflare：CI 直连可能 403，脚本内降级沿用快照
      - name: Fetch arena boards
        run: pnpm fetch-arena

      # 数据提交回仓库：定时抓取的增量持久化，否则文章滚出 RSS 10 条窗口即永久丢失。
      # [skip ci] 防止此提交再触发 push 工作流（无限循环）。
      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git diff --staged --quiet || git commit -m "chore(data): scheduled refresh [skip ci]"
          git push

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
